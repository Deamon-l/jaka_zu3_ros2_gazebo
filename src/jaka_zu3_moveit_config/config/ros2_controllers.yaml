controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jaka_zu3_controller:
      type: joint_trajectory_controller/JointTrajectoryController

jaka_zu3_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: false

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
