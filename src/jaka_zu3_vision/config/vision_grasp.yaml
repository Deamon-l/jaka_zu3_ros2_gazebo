target_detector:
  ros__parameters:
    rgb_topic: /wrist_camera/rgb_image
    depth_topic: /wrist_camera/depth_image
    camera_info_topic: /wrist_camera/camera_info
    point_topic: /detected_target_point
    marker_topic: /detected_target_marker
    target_frame: world
    camera_frame: camera_optical_frame
    use_latest_tf: true
    max_rgb_depth_delta: 0.25
    min_area: 40.0
    max_area: 6000.0
    min_saturation: 90
    min_value: 60
    min_depth: 0.10
    max_depth: 2.0
    min_depth_samples: 8
    image_width: 128
    image_height: 96
    horizontal_fov: 1.047

target_motion:
  ros__parameters:
    group_name: jaka_zu3
    end_effector_link: gripper_base_link
    target_frame: world
    target_topic: /detected_target_point
    # Height selection uses the detected top surface in world coordinates.
    # Small objects: fingers span ground to 40 mm (base z fixed at 60 mm).
    # Tall objects: finger top follows the object top (base = top + 20 mm).
    object_height_threshold: 0.04
    small_object_gripper_base_z: 0.06
    large_object_top_offset_z: 0.02
    approach_offset_z: 0.14
    lift_offset_z: 0.16
    # Fixed destination in world. Z is the placed cube's top surface.
    place_x: 0.35
    place_y: -0.15
    place_z: 0.02
    place_approach_offset_z: 0.14
    # 1: source -> destination; 2: destination -> original source as well.
    transfer_cycles: 1
    repeat_delay: 1.0
    # These joints move inward as the value increases.
    open_width: 0.0
    # 10 mm travel on each side closes the 40 mm opening onto a 20 mm cube.
    closed_width: 0.010
    gripper_min_position: 0.0
    gripper_max_position: 0.011
    gripper_motion_time: 2.0
    grasp_settle_time: 0.5
    # Never lift while one finger is late. Reopen/reclose once at grasp height.
    gripper_sync_timeout: 2.0
    gripper_close_attempts: 2
    finger_sync_tolerance: 0.001
    finger_goal_tolerance: 0.002
    # Require fresh, separately measured positions from both fingers.
    finger_state_timeout: 0.5
    use_sim_attachment: false
    attachment_timeout: 1.0
    attach_topic: /gripper/attach
    detach_topic: /gripper/detach
    attachment_state_topic: /gripper/attached
    action_timeout: 90.0
    max_target_age: 0.75
    required_stable_detections: 5
    target_stability_tolerance: 0.015
    position_tolerance: 0.005
    orientation_tolerance: 0.10
    planning_pipeline: pilz_industrial_motion_planner
    point_to_point_planner: PTP
    linear_planner: LIN
    velocity_scaling: 0.15
    # Keep margin for Pilz LIN inverse-kinematics acceleration limits when
    # the target moves away from the original world position.
    acceleration_scaling: 0.05
    workspace_min_x: -0.75
    workspace_max_x: 0.75
    workspace_min_y: -0.75
    workspace_max_y: 0.75
    workspace_min_z: 0.0
    workspace_max_z: 0.75
